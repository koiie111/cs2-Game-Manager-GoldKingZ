name: Build and release

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '23 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.plan.outputs.version }}
      tag: ${{ steps.plan.outputs.tag }}
      build: ${{ steps.plan.outputs.build }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/github-script@v7
        id: plan
        with:
          script: |
            const fs = require('fs');
            const project = fs.readFileSync('Game-Manager-GoldKingZ.csproj', 'utf8');
            let version = project.match(/Include="CounterStrikeSharp.API" Version="([^"]+)"/)[1];
            const publish = context.ref === 'refs/heads/main' && context.eventName !== 'pull_request';
            if (publish) {
              const response = await fetch('https://api.nuget.org/v3-flatcontainer/counterstrikesharp.api/index.json',
                { signal: AbortSignal.timeout(30000) });
              if (!response.ok) throw new Error('NuGet HTTP ' + response.status);
              const versions = (await response.json()).versions.filter(v => /^\d+\.\d+\.\d+$/.test(v));
              versions.sort((a, b) => {
                const x = a.split('.').map(Number), y = b.split('.').map(Number);
                return x[0]-y[0] || x[1]-y[1] || x[2]-y[2];
              });
              if (!versions.length) throw new Error('No stable CounterStrikeSharp version found');
              version = versions.at(-1);
            }
            const tag = 'build-' + context.sha + '-css-' + version;
            let build = true;
            if (publish) {
              try {
                await github.rest.repos.getReleaseByTag({ ...context.repo, tag });
                build = false;
              } catch (error) {
                if (error.status !== 404) throw error;
              }
            }
            core.setOutput('version', version);
            core.setOutput('tag', tag);
            core.setOutput('build', String(build));
            core.notice(build ? 'Building CounterStrikeSharp ' + version : 'Release already exists: ' + tag);

  build:
    needs: plan
    if: needs.plan.outputs.build == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Select CounterStrikeSharp for release
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          CSS_VERSION: ${{ needs.plan.outputs.version }}
        run: |
          dotnet add Game-Manager-GoldKingZ.csproj package CounterStrikeSharp.API --version "$CSS_VERSION" --no-restore
          dotnet restore Game-Manager-GoldKingZ.csproj --force-evaluate
      - run: dotnet restore Game-Manager-GoldKingZ.csproj --locked-mode
      - run: dotnet build Game-Manager-GoldKingZ.csproj -c Release --no-restore
      - run: dotnet restore tests/Tests.csproj --locked-mode
      - run: dotnet run --project tests/Tests.csproj -c Release --no-restore
      - run: python tests/verify_measurements.py
      - name: Package plugin
        env:
          CSS_VERSION: ${{ needs.plan.outputs.version }}
          RELEASE_TAG: ${{ needs.plan.outputs.tag }}
        run: |
          set -euo pipefail
          plugin=bin/Release/addons/counterstrikesharp/plugins/Game-Manager-GoldKingZ
          test -s "$plugin/Game-Manager-GoldKingZ.dll"
          test -s "$plugin/Game-Manager-GoldKingZ.deps.json"
          test -s "$plugin/Newtonsoft.Json.dll"
          test -s "$plugin/lang/en.json"
          mkdir -p dist
          python - <<'PY'
          import json, os, pathlib, shutil
          root = pathlib.Path("bin/Release")
          metadata = root / "BUILD.json"
          metadata.write_text(json.dumps({
              "commit": os.environ["GITHUB_SHA"],
              "counterstrikesharp": os.environ["CSS_VERSION"],
              "tag": os.environ["RELEASE_TAG"],
              "run": os.environ["GITHUB_SERVER_URL"] + "/" + os.environ["GITHUB_REPOSITORY"] + "/actions/runs/" + os.environ["GITHUB_RUN_ID"]
          }, indent=2) + "\n")
          shutil.copy("packages.lock.json", root / "packages.lock.json")
          shutil.copy("UPGRADE.md", root / "UPGRADE.md")
          shutil.make_archive("dist/Game-Manager-GoldKingZ-" + os.environ["RELEASE_TAG"], "zip", root)
          PY
          cd dist
          sha256sum *.zip > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: release-package
          path: dist/*
          if-no-files-found: error

  release:
    needs: [plan, build]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-package
          path: dist
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.plan.outputs.tag }}
          CSS_VERSION: ${{ needs.plan.outputs.version }}
        run: |
          cat > notes.md <<EOF
          Automated build of commit $GITHUB_SHA against CounterStrikeSharp.API $CSS_VERSION.

          Extract the ZIP into the game directory. Requires .NET 10 and a compatible CounterStrikeSharp runtime.
          ClientPrefs GoldKingZ 1.0.3 must be installed separately. Preserve existing configurations and translations.
          BUILD.json and packages.lock.json record the exact build inputs; SHA256SUMS verifies the ZIP.
          Offline checks passed; live CS2 compatibility is not tested by this workflow.
          EOF
          gh release create "$RELEASE_TAG" dist/* --target "$GITHUB_SHA" --title "Game Manager · CSS $CSS_VERSION · ${GITHUB_SHA:0:7}" --notes-file notes.md --latest
